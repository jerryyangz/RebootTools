name: Build LockNow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'LockNow/**'
      - '.github/workflows/build-locknow.yml'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 缓存 Theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-v1

      - name: 安装 Theos
        run: |
          set -e
          if [ -d "$THEOS/makefiles" ]; then
            echo "Theos 已从缓存恢复"
            exit 0
          fi
          mkdir -p "$THEOS"
          ok=0
          for i in 1 2 3; do
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"; then ok=1; break; fi
            echo "install-theos 第 $i 次失败，5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ] || [ ! -d "$THEOS/makefiles" ]; then
            echo "官方安装脚本失败，改为直接克隆"
            rm -rf "$THEOS"
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          test -d "$THEOS/makefiles"

      - name: 确保 ldid 可用
        run: |
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already available: $(command -v ldid)"
          else
            mkdir -p "$HOME/bin"
            for name in "ldid_macosx_$(uname -m)" ldid_macosx_arm64 ldid_macosx_x86_64; do
              if curl -fsSL -o "$HOME/bin/ldid" "https://github.com/ProcursusTeam/ldid/releases/latest/download/$name"; then
                chmod +x "$HOME/bin/ldid"
                echo "downloaded $name"
                break
              fi
            done
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          ldid -v || echo "ldid 不可用（TrollStore 安装时会重签）"

      - name: 编译并打包
        run: |
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          cd LockNow
          make clean || true
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa
          echo "--- packages ---"
          ls -lh packages/
          echo "--- bundle 内容 ---"
          find .theos/_/Applications/LockNow.app -maxdepth 1 -type f | head -20

      - name: 上传 tipa
        uses: actions/upload-artifact@v4
        with:
          name: LockNow-tipa
          path: LockNow/packages/*.tipa
          if-no-files-found: error

      - name: 发布 Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: locknow-v1.0.1
          name: 一键锁屏 1.0.1
          body: |
            点开图标立即锁屏并熄灭屏幕，没有界面、没有确认框。

            **1.0.1 修复了 1.0.0 的启动闪退**：旧版把 dlsym 命中的 11 个私有符号一律当成 void(long) 盲调，且用 dlopen(RTLD_NOW) 强制加载私有框架，签名不符时会 EXC_BAD_ACCESS。新版彻底移除私有框架探测与盲调，只调用签名确定的公开 Darwin 通知 API。

            - 主入口 `com.apple.springboard.toggleLockScreen`，来自 CVE-2025-24091 官方 PoC（该限制直到 iOS 18.3 才加入，iOS 15/16/17 可直接发送）
            - 辅助入口 `GSEventLockDevice()` 使用正确的 void(void) 签名，仅在当前进程已导出时调用，不 dlopen 私有框架
            - 每个阶段都会读取 `com.apple.springboard.lockstate` 校验是否真的锁定，避免重复 toggle 解锁
            - 锁屏成功后 App 自动退出，解锁后直接回到桌面
            - 未生效时停在诊断界面，长按可复制各阶段状态用于排查
            - 支持 iOS / iPadOS 14.0 及以上，arm64 / arm64e；请用 TrollStore 安装
          files: LockNow/packages/*.tipa
          fail_on_unmatched_files: true
