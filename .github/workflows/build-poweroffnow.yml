name: Build PowerOffNow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'PowerOffNow/**'
      - '.github/workflows/build-poweroffnow.yml'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 缓存 Theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-v1

      - name: 安装 Theos
        run: |
          set -e
          if [ -d "$THEOS/makefiles" ]; then
            echo "Theos 已从缓存恢复"
            ls "$THEOS" | head
            exit 0
          fi
          mkdir -p "$THEOS"
          ok=0
          for i in 1 2 3; do
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"; then ok=1; break; fi
            echo "install-theos 第 $i 次失败，5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ] || [ ! -d "$THEOS/makefiles" ]; then
            echo "官方安装脚本失败，改为直接克隆"
            rm -rf "$THEOS"
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          test -d "$THEOS/makefiles"
          ls "$THEOS" | head

      - name: 确保 ldid 可用
        run: |
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already available: $(command -v ldid)"
          else
            mkdir -p "$HOME/bin"
            for name in "ldid_macosx_$(uname -m)" ldid_macosx_arm64 ldid_macosx_x86_64; do
              if curl -fsSL -o "$HOME/bin/ldid" "https://github.com/ProcursusTeam/ldid/releases/latest/download/$name"; then
                chmod +x "$HOME/bin/ldid"
                echo "downloaded $name"
                break
              fi
            done
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          ldid -v || echo "ldid 不可用（签名将跳过，TrollStore 安装时会重签）"

      - name: 生成并编译关机 helper
        run: |
          set -ex
          export PATH="$THEOS/bin:$HOME/bin:$PATH"

          # iOS SDK 不含 <sys/reboot.h>；直接内联生成不依赖私有头的源码
          cat > PowerOffNow/Helper/main.c << 'CSRC'
          #include <unistd.h>
          #include <stdio.h>
          #include <errno.h>
          #include <string.h>
          #include <dlfcn.h>

          /* iOS SDK has no <sys/reboot.h>. Use dlsym() so no private header/symbol is needed. */
          #define RB_HALT 0x08
          typedef int (*reboot_fn)(int);

          static void try_exec(const char *path, char *const argv[])
          {
              if (access(path, X_OK) != 0) return;
              execv(path, argv);
          }

          int main(int argc, char *argv[])
          {
              sync();
              char *shutdownArgs[] = { "shutdown", "-h", "now", NULL };
              char *haltArgs[] = { "halt", NULL };
              try_exec("/var/jb/usr/bin/shutdown", shutdownArgs);
              try_exec("/var/jb/usr/bin/halt", haltArgs);
              try_exec("/usr/bin/shutdown", shutdownArgs);
              try_exec("/usr/bin/halt", haltArgs);
              reboot_fn reboot_sys = (reboot_fn)dlsym(RTLD_DEFAULT, "reboot");
              if (reboot_sys != NULL) {
                  reboot_sys(RB_HALT);
                  fprintf(stderr, "poweroff failed: reboot(RB_HALT): %s\n", strerror(errno));
              } else {
                  fprintf(stderr, "poweroff failed: reboot() unavailable\n");
              }
              return 1;
          }
          CSRC

          echo "=== 环境 ==="
          uname -a
          xcodebuild -version || true
          clang --version | head -3 || true
          command -v ldid || echo "!! ldid 不在 PATH"

          echo "=== 定位 iOS SDK ==="
          SDK="$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)"
          echo "xcrun SDK=[$SDK]"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk 2>/dev/null | tail -1)"
            echo "theos SDK=[$SDK]"
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "!! 找不到任何 iOS SDK，编译中止"
            exit 1
          fi
          echo "SDK 已确认: $SDK"

          echo "=== 编译 ==="
          cd PowerOffNow/Helper
          set +e
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" -O2 -Wall main.c -o /tmp/po_arm64
          echo "arm64 exit=$?"
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" -O2 -Wall main.c -o /tmp/po_arm64e
          echo "arm64e exit=$?"
          lipo -create /tmp/po_arm64 /tmp/po_arm64e -output ../Resources/PowerOffHelper
          echo "lipo exit=$?"
          set -e
          test -f ../Resources/PowerOffHelper

          echo "=== 签名 ==="
          if command -v ldid >/dev/null 2>&1; then
            ldid -S"$(pwd)/entitlements.plist" ../Resources/PowerOffHelper
          fi
          chmod +x ../Resources/PowerOffHelper
          file ../Resources/PowerOffHelper
          echo "=== 完成 ==="

      - name: 编译并打包
        run: |
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          cd PowerOffNow
          make clean || true
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa
          echo "--- packages ---"
          ls -lh packages/
          echo "--- bundle 内容 ---"
          find .theos/_/Applications/PowerOffNow.app -maxdepth 1 -type f | head -20
          ls -l .theos/_/Applications/PowerOffNow.app/PowerOffHelper

      - name: 上传 tipa
        uses: actions/upload-artifact@v4
        with:
          name: PowerOffNow-tipa
          path: PowerOffNow/packages/*.tipa
          if-no-files-found: error

      - name: 发布 Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poweroffnow-v1.0.0
          name: 一键关机 1.0.0
          body: |
            点开图标立即关机，没有界面、没有确认框。

            - 必须用 TrollStore 安装（需要 platform-application 权限才能以 root 运行关机 helper）
            - 支持 iOS / iPadOS 14.0 及以上，arm64 / arm64e
            - 越狱环境下优先调用 bootstrap 的 shutdown / halt；纯 TrollStore 环境退化为内核停机
            - 关机后需按电源键重新开机
          files: PowerOffNow/packages/*.tipa
          fail_on_unmatched_files: true
