name: Build tipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'RespringNow/**'
      - 'PowerOffNow/**'
      - 'LockNow/**'
      - '.github/workflows/build-respringnow.yml'
      - '.github/workflows/build-poweroffnow.yml'
      - '.github/workflows/build-locknow.yml'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS"
          ls "$THEOS" | head

      - name: 确保 ldid 可用
        run: |
          set -e
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already available: $(command -v ldid)"
          else
            mkdir -p "$HOME/bin"
            for name in "ldid_macosx_$(uname -m)" ldid_macosx_arm64 ldid_macosx_x86_64; do
              if curl -fsSL -o "$HOME/bin/ldid" "https://github.com/ProcursusTeam/ldid/releases/latest/download/$name"; then
                chmod +x "$HOME/bin/ldid"
                echo "downloaded $name"
                break
              fi
            done
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          ldid -v || true

      - name: 编译并打包
        run: |
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa
          echo "--- packages ---"
          ls -lh packages/

      - name: 上传 tipa
        uses: actions/upload-artifact@v4
        with:
          name: RebootTools-tipa
          path: packages/*.tipa
          if-no-files-found: error

      # 把 .tipa 挂到 Release 上，方便拿到无需登录的公开直链
      - name: 发布 Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: RebootTools 1.2.2
          body: |
            - 倒计时器已启用（秒数 > 0）时，执行重启/注销不再弹出「确定要执行吗」确认框，直接进入倒计时并自动执行
            - 倒计时器启用时，「设置 → 执行前显示提示」自动置灰，避免误解
            - 新增 GitHub Actions 自动编译出包
          files: packages/*.tipa
          fail_on_unmatched_files: true
