name: Build PowerOffNow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'PowerOffNow/**'
      - '.github/workflows/build-poweroffnow.yml'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          set -e
          mkdir -p "$THEOS"
          ok=0
          for i in 1 2 3; do
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"; then ok=1; break; fi
            echo "install-theos 第 $i 次失败，5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ] || [ ! -d "$THEOS/makefiles" ]; then
            echo "官方安装脚本失败，改为直接克隆"
            rm -rf "$THEOS"
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          test -d "$THEOS/makefiles"
          echo "THEOS=$THEOS"
          ls "$THEOS" | head

      - name: 确保 ldid 可用
        run: |
          set -e
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already available: $(command -v ldid)"
          else
            mkdir -p "$HOME/bin"
            for name in "ldid_macosx_$(uname -m)" ldid_macosx_arm64 ldid_macosx_x86_64; do
              if curl -fsSL -o "$HOME/bin/ldid" "https://github.com/ProcursusTeam/ldid/releases/latest/download/$name"; then
                chmod +x "$HOME/bin/ldid"
                echo "downloaded $name"
                break
              fi
            done
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          ldid -v || true

      - name: 编译关机 helper
        run: |
          set -e
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          cd PowerOffNow/Helper
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -miphoneos-version-min=14.0 -O2 -isysroot "$SDK" \
            main.c -o ../Resources/PowerOffHelper
          ldid -S"$(pwd)/entitlements.plist" ../Resources/PowerOffHelper
          chmod +x ../Resources/PowerOffHelper
          file ../Resources/PowerOffHelper
          codesign -d --entitlements - ../Resources/PowerOffHelper 2>&1 | head -12 || true

      - name: 编译并打包
        run: |
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          cd PowerOffNow
          make clean || true
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa
          echo "--- packages ---"
          ls -lh packages/
          echo "--- bundle 内容 ---"
          find .theos/_/Applications/PowerOffNow.app -maxdepth 1 -type f | head -20
          ls -l .theos/_/Applications/PowerOffNow.app/PowerOffHelper

      - name: 上传 tipa
        uses: actions/upload-artifact@v4
        with:
          name: PowerOffNow-tipa
          path: PowerOffNow/packages/*.tipa
          if-no-files-found: error

      - name: 发布 Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poweroffnow-v1.0.0
          name: 一键关机 1.0.0
          body: |
            点开图标立即关机，没有界面、没有确认框。

            - 必须用 TrollStore 安装（需要 platform-application 权限才能以 root 运行关机 helper）
            - 支持 iOS / iPadOS 14.0 及以上，arm64 / arm64e
            - 越狱环境下优先调用 bootstrap 的 shutdown / halt；纯 TrollStore 环境退化为内核停机
            - 关机后需按电源键重新开机
          files: PowerOffNow/packages/*.tipa
          fail_on_unmatched_files: true
