name: Build LockNow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'LockNow/**'
      - '.github/workflows/build-locknow.yml'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 缓存 Theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-v1

      - name: 安装 Theos
        run: |
          set -e
          if [ -d "$THEOS/makefiles" ]; then
            echo "Theos 已从缓存恢复"
            exit 0
          fi
          mkdir -p "$THEOS"
          ok=0
          for i in 1 2 3; do
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"; then ok=1; break; fi
            echo "install-theos 第 $i 次失败，5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ] || [ ! -d "$THEOS/makefiles" ]; then
            echo "官方安装脚本失败，改为直接克隆"
            rm -rf "$THEOS"
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          test -d "$THEOS/makefiles"

      - name: 确保 ldid 可用
        run: |
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already available: $(command -v ldid)"
          else
            mkdir -p "$HOME/bin"
            for name in "ldid_macosx_$(uname -m)" ldid_macosx_arm64 ldid_macosx_x86_64; do
              if curl -fsSL -o "$HOME/bin/ldid" "https://github.com/ProcursusTeam/ldid/releases/latest/download/$name"; then
                chmod +x "$HOME/bin/ldid"
                echo "downloaded $name"
                break
              fi
            done
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          ldid -v || echo "ldid 不可用（TrollStore 安装时会重签）"

      - name: 编译并打包
        run: |
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          cd LockNow
          make clean || true
          set -o pipefail
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa 2>&1 | tee /tmp/locknow-build.log
          echo "--- packages ---"
          ls -lh packages/
          echo "--- bundle 内容 ---"
          find .theos/_/Applications/LockNow.app -maxdepth 1 -type f | head -20

      - name: 打印编译错误
        if: failure()
        run: |
          if [ -f /tmp/locknow-build.log ]; then
            echo "::group::编译日志中的错误行"
            grep -nE "error:|Error [0-9]+|\*\*\*|undefined|No such file|ld: |clang: |swiftc: |fatal error" /tmp/locknow-build.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo "::endgroup::"
            echo "::group::编译日志末尾 60 行"
            tail -60 /tmp/locknow-build.log
            echo "::endgroup::"
          fi

      - name: 上传 tipa
        uses: actions/upload-artifact@v4
        with:
          name: LockNow-tipa
          path: LockNow/packages/*.tipa
          if-no-files-found: error

      - name: 发布 Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: locknow-v1.0.2
          name: 一键锁屏 1.0.2
          body: |
            点开图标即请求锁屏并熄灭屏幕。本版重点解决 1.0.0 / 1.0.1 连续两次「点开就闪退」。

            **1.0.2 的三处关键修复**

            1. 删除 `applicationDidEnterBackground` 里的 `exit(EXIT_SUCCESS)`。锁屏通知只要让 App 短暂失焦，旧版进程就会立刻自杀，用户看到的就是「闪退且屏幕没灭」；已真机验证的 RespringNow 并没有这个回调。本版绝不自动退出。
            2. 彻底移除所有私有框架加载与私有符号调用（1.0.1 仍保留了一个 GraphicsServices 私有锁屏函数，是两版唯一的共同危险调用）。现在只调用 libSystem 的公开 `notify_post()`，从结构上消除 EXC_BAD_ACCESS。
            3. 内置崩溃哨兵：SIGSEGV / SIGBUS / SIGABRT / SIGILL / SIGFPE 触发时把「崩在第几阶段」写入 Documents/locknow-crash.log，下次启动显示并清空；发现记录时进入安全模式，不再自动执行锁屏，避免连续闪退看不到诊断。

            - 逐条发送 6 个锁屏候选 Darwin 通知，每条后读取 `com.apple.springboard.lockstate`，检测到已锁定立即停止，避免 toggle 反向解锁
            - 首条入口 `com.apple.springboard.toggleLockScreen` 来自 CVE-2025-24091 官方 PoC（该限制 iOS 18.3 才加入）
            - 未生效时停在诊断界面，长按可复制各阶段 rc 与状态变化
            - 支持 iOS / iPadOS 14.0 及以上，arm64 / arm64e；请用 TrollStore 安装
            - 1.0.0 / 1.0.1 的 Release 均保留，可随时回滚
          files: LockNow/packages/*.tipa
          fail_on_unmatched_files: true
