name: Build LockNow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'LockNow/**'
      - '.github/workflows/build-locknow.yml'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 缓存 Theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-v1

      - name: 安装 Theos
        run: |
          set -e
          if [ -d "$THEOS/makefiles" ]; then
            echo "Theos 已从缓存恢复"
            exit 0
          fi
          mkdir -p "$THEOS"
          ok=0
          for i in 1 2 3; do
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"; then ok=1; break; fi
            echo "install-theos 第 $i 次失败，5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ] || [ ! -d "$THEOS/makefiles" ]; then
            echo "官方安装脚本失败，改为直接克隆"
            rm -rf "$THEOS"
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          test -d "$THEOS/makefiles"

      - name: 确保 ldid 可用
        run: |
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already available: $(command -v ldid)"
          else
            mkdir -p "$HOME/bin"
            for name in "ldid_macosx_$(uname -m)" ldid_macosx_arm64 ldid_macosx_x86_64; do
              if curl -fsSL -o "$HOME/bin/ldid" "https://github.com/ProcursusTeam/ldid/releases/latest/download/$name"; then
                chmod +x "$HOME/bin/ldid"
                echo "downloaded $name"
                break
              fi
            done
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          ldid -v || echo "ldid 不可用（TrollStore 安装时会重签）"

      - name: 编译并打包
        run: |
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          cd LockNow
          make clean || true
          set -o pipefail
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa 2>&1 | tee /tmp/locknow-build.log
          echo "--- packages ---"
          ls -lh packages/
          echo "--- bundle 内容 ---"
          find .theos/_/Applications/LockNow.app -maxdepth 1 -type f | head -20

      - name: 打印编译错误
        if: failure()
        run: |
          if [ -f /tmp/locknow-build.log ]; then
            echo "::group::编译日志中的错误行"
            grep -nE "error:|Error [0-9]+|\*\*\*|undefined|No such file|ld: |clang: |swiftc: |fatal error" /tmp/locknow-build.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo "::endgroup::"
            echo "::group::编译日志末尾 60 行"
            tail -60 /tmp/locknow-build.log
            echo "::endgroup::"
          fi

      - name: 上传 tipa
        uses: actions/upload-artifact@v4
        with:
          name: LockNow-tipa
          path: LockNow/packages/*.tipa
          if-no-files-found: error

      - name: 发布 Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: locknow-v1.0.3
          name: 一键锁屏 1.0.3
          body: |
            点开图标即请求锁屏并熄灭屏幕。本版由真机崩溃日志驱动修复。

            **1.0.3 修复了 1.0.0 / 1.0.1 / 1.0.2 连续三次「点开就闪退」**

            1.0.2 的崩溃哨兵在真机回报 `CRASH sig=11 stage=1 note=didFinishLaunching`。stage=1 是「哨兵装好」到「lockScreen 开始」之间的唯一阶段号，说明崩溃发生在启动 UI 路径上，锁屏代码一次都没执行过 —— 前两版一直在改锁屏 API，方向错了，通知根本没发出去。

            本版把启动路径做成与真机验证成功的 RespringNow 逐行同构，删除 LockNow 独有的全部额外机制：

            - 删除崩溃哨兵（signal handler、C 函数桥接、Documents 文件 IO）
            - 删除动态符号解析，改用编译期 extern 声明 libSystem 的公开 Darwin 符号，并加 weak_import 防止 dyld 在启动时终止 App
            - 删除后台队列与人为延迟，锁屏调用在主线程 viewDidAppear 同步执行，全程 < 50ms
            - 删除安全模式、多行文本框、复杂约束与 viewDidLoad 抢跑
            - 只用 UILabel / UIButton；绝不自动退出，只有点「退出」才结束进程

            - 逐条投递 5 个锁屏候选 Darwin 通知，每条后读取 `com.apple.springboard.lockstate`，检测到已锁定立即停止，避免 toggle 反向解锁
            - 首条入口 `com.apple.springboard.toggleLockScreen` 来自 CVE-2025-24091 官方 PoC（发送方限制 iOS 18.3 才加入）
            - 结果页显示每条 rc 与状态变化，可点「复制诊断」粘贴出来
            - 支持 iOS / iPadOS 14.0 及以上，arm64 / arm64e；请用 TrollStore 安装
            - 1.0.0 / 1.0.1 / 1.0.2 的 Release 均保留，可随时回滚
          files: LockNow/packages/*.tipa
          fail_on_unmatched_files: true
