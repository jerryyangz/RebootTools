name: Build LockNow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'LockNow/**'
      - '.github/workflows/build-locknow.yml'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15-intel-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 缓存 Theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-v1

      - name: 安装 Theos
        run: |
          set -e
          if [ -d "$THEOS/makefiles" ]; then
            echo "Theos 已从缓存恢复"
            exit 0
          fi
          mkdir -p "$THEOS"
          ok=0
          for i in 1 2 3; do
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"; then ok=1; break; fi
            echo "install-theos 第 $i 次失败，5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ] || [ ! -d "$THEOS/makefiles" ]; then
            echo "官方安装脚本失败，改为直接克隆"
            rm -rf "$THEOS"
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          test -d "$THEOS/makefiles"

      - name: 确保 ldid 可用
        run: |
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already available: $(command -v ldid)"
          else
            mkdir -p "$HOME/bin"
            for name in "ldid_macosx_$(uname -m)" ldid_macosx_arm64 ldid_macosx_x86_64; do
              if curl -fsSL -o "$HOME/bin/ldid" "https://github.com/ProcursusTeam/ldid/releases/latest/download/$name"; then
                chmod +x "$HOME/bin/ldid"
                echo "downloaded $name"
                break
              fi
            done
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          ldid -v || echo "ldid 不可用（TrollStore 安装时会重签）"

      - name: 编译并打包
        run: |
          export PATH="$THEOS/bin:$HOME/bin:$PATH"
          cd LockNow
          make clean || true
          set -o pipefail
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa 2>&1 | tee /tmp/locknow-build.log
          echo "--- packages ---"
          ls -lh packages/
          echo "--- bundle 内容 ---"
          find .theos/_/Applications/LockNow.app -maxdepth 1 -type f | head -20

      - name: 打印编译错误
        if: failure()
        run: |
          if [ -f /tmp/locknow-build.log ]; then
            echo "::group::编译日志中的错误行"
            grep -nE "error:|Error [0-9]+|\*\*\*|undefined|No such file|ld: |clang: |swiftc: |fatal error" /tmp/locknow-build.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo "::endgroup::"
            echo "::group::编译日志末尾 60 行"
            tail -60 /tmp/locknow-build.log
            echo "::endgroup::"
          fi

      - name: 上传 tipa
        uses: actions/upload-artifact@v4
        with:
          name: LockNow-tipa
          path: LockNow/packages/*.tipa
          if-no-files-found: error

      - name: 发布 Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: locknow-v1.1.0
          name: 一键锁屏 1.1.0（纯 ObjC 重写版）
          body: |
            点开图标立即锁屏并熄灭屏幕。1.1.0 是**纯 Objective-C 重写版**，解决 1.0.0 ~ 1.0.3 连续四次点开闪退。

            用户用纯 ObjC 对照包「锁屏诊断」实测确认：

            - 纯 ObjC 启动链路完全正常（能看到「✅ 启动成功」）
            - `notify_post("com.apple.springboard.toggleLockScreen")` 点击后**屏幕熄灭**，即该通知在 iOS 15.8.8 上确实有效

            因此四版闪退的根因收敛为 Swift + ObjC 混编启动链路，以及同一 Bundle ID 反复覆盖安装。本版按已验证结构重写：

            - 纯 Objective-C（`main.m` + `UIApplicationMain`），零 Swift 运行时依赖、无 bridging header
            - 全新 Bundle ID `com.jerryyangz.LockNowOC`，绕开旧 ID 覆盖安装的签名缓存问题；**安装前请先删除旧的「一键锁屏」图标**
            - 启动后在 `viewDidAppear` 自动发送**一条**锁屏通知；只发一条，避免 toggle 语义把屏幕反向解开
            - 绝不自动退出，锁屏后解锁回来能看到结果页（rc、lockstate 前后变化、版本与 Bundle ID）
            - 提供「再锁一次 / 复制诊断 / 退出」
            - entitlements 与前版一致；支持 iOS / iPadOS 14.0 及以上，arm64 / arm64e；请用 TrollStore 安装

            1.0.0 / 1.0.1 / 1.0.2 / 1.0.3 的 Release 均保留，可随时回滚。
          files: LockNow/packages/*.tipa
          fail_on_unmatched_files: true
